name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: macos-15
            artifact: macos-arm64
          - os: windows-2025
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Install independent QR decoder
        if: runner.os == 'Linux'
        run: python3 -m pip install -r requirements-design.txt
      - name: Native visual regression evidence
        if: runner.os == 'Linux'
        run: python3 scripts/verify_design.py --binary target/release/signal-rune
      - name: Package with Signal engine and Java runtime
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: signal-rune-${{ matrix.artifact }}
          path: |
            dist/signal-rune-*.dmg
            dist/signal-rune-*.zip
            dist/signal-rune-linux-x64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: design-evidence
          path: target/design/
