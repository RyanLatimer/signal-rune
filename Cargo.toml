[package]
name = "signal-rune"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "An experimental native Rune desktop client for Signal"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "3e0cf8fe58d592cdda1ec5533461192edcfcdb47", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "3e0cf8fe58d592cdda1ec5533461192edcfcdb47" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
directories = "6"

aes-gcm = "0.10.3"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
mime_guess = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
zeroize = "1"
fs2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "async-io", "crypto-rust"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
