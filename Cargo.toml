[package]
name = "signal-rune"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "An experimental native Rune desktop client for Signal"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "3e0cf8fe58d592cdda1ec5533461192edcfcdb47" }
